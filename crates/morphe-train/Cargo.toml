[package]
name = "morphe-train"
version = "0.1.0"
description = "Learns a language's inflection from a Kaikki Wiktionary dump and emits a Rust crate"
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish = false

[dependencies]
morphe = { path = "../morphe" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
flate2 = "1"
